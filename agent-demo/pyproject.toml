[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-agent-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2.0", "langchain-openai>=1.0,<2.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["agent"]
